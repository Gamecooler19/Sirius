[databases]
univadmissions = host=postgres port=5432 dbname=univadmissions

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
;; auth_type = trust: acceptable here because pgbouncer is reachable only
;; from the api/migrate containers on the same private compose bridge
;; network, never published to the host. Postgres 17 defaults to
;; scram-sha-256, which pgbouncer's md5 auth_type cannot verify without a
;; matching stored hash, so trust is the pragmatic choice for local dev.
auth_type = trust
;; auth_file governs pgbouncer's OWN outbound connection to Postgres, a
;; separate leg from auth_type above.
auth_file = /etc/pgbouncer/userlist.txt
;; ADR-01: transaction pooling. Every request opens one transaction, issues
;; SET LOCAL for its RLS GUCs, does its work, commits.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
ignore_startup_parameters = extra_float_digits,options
