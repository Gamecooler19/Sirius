name: sirius

# Local development stack only. No ADR-06 (loopback-only publish / UFW
# hardening) in this module -- that concern is specific to a public cloud
# deployment target, which this module does not have yet. Datastores
# (postgres, pgbouncer, valkey) still publish nothing to the host: there is
# no reason for them to, and the api/migrate containers reach them by
# service name over the compose bridge network regardless. api and rustfs
# publish on plain loopback (127.0.0.1) as an ordinary local-dev habit, not
# because a UFW/DOCKER-USER threat model applies yet.
#
# Credentials come from deploy/.env (gitignored; deploy/.env.example is
# committed) via Compose's ${VAR} interpolation at parse time -- no running
# container ever sees deploy/.env as a filesystem path.

networks:
  sirius-net:
    driver: bridge

volumes:
  sirius-postgres-data:
  sirius-valkey-data:
  sirius-rustfs-data:

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # POSTGRES_USER is the bootstrap superuser, deliberately NOT
      # "sirius" -- see ADR-02 and 01-create-app-role.sh.
      POSTGRES_DB: sirius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SIRIUS_DB_PASSWORD: ${SIRIUS_DB_PASSWORD}
    volumes:
      - sirius-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - sirius-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sirius"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "6432"
    networks:
      - sirius-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U sirius -d sirius"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - sirius-valkey-data:/data
    expose:
      - "6379"
    networks:
      - sirius-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:17188
    volumes:
      - sirius-rustfs-data:/data
    ports:
      - "127.0.0.1:17188:17188"
    networks:
      - sirius-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:17188/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Module 16: real SMTP server for local development, not a third-party
  # email API. Mailpit accepts any mail sent to it over SMTP (no real
  # delivery ever leaves this stack) and exposes both a web UI and a REST
  # API to read what was "sent" -- the exact tool a live-verification
  # standard that requires reading a real email (not asserting the
  # backend queued something) needs. Same dual-surface pattern rustfs
  # already follows: reachable by service name (`mailpit:1025`) over the
  # internal bridge network for the api container's own SMTP traffic,
  # and its web UI published on loopback only (`127.0.0.1:8025`) for a
  # human/browser to actually read captured mail, matching every other
  # dev-facing service in this stack. The image ships its own
  # `/mailpit readyz` healthcheck subcommand baked into its Dockerfile
  # (alpine-based, confirmed from the upstream Dockerfile -- no curl/wget
  # needed), so no custom healthcheck override is needed here, unlike
  # postgres/pgbouncer/valkey/rustfs which do define their own.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - sirius-net

  # One-shot migration runner: applies `alembic upgrade head` and exits.
  # `api` depends on this completing successfully rather than running
  # migrations in its own entrypoint, avoiding a race between the app
  # starting and migrations completing.
  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://sirius:${SIRIUS_DB_PASSWORD}@pgbouncer:6432/sirius
      # ADR-01 point 3 + ADR-02: direct-to-Postgres (bypassing PgBouncer)
      # for Alembic's DDL/advisory-lock session continuity, but as the
      # ordinary `sirius` role, never as the `postgres` bootstrap
      # superuser -- migrations must create every table AS the role that
      # will later own and be FORCE-RLS-subject to it (ADR-02), or table
      # ownership silently lands on `postgres` instead and the app role
      # ends up with zero privileges on its own schema's tables. Found and
      # fixed for real during this module's own live-stack verification:
      # connecting as postgres here left `sirius` unable to even
      # SELECT from "role" ("permission denied for table role").
      DATABASE_DIRECT_URL: postgresql+asyncpg://sirius:${SIRIUS_DB_PASSWORD}@postgres:5432/sirius
      VALKEY_URL: redis://valkey:6379/0
      RUSTFS_ENDPOINT: http://rustfs:17188
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sirius-net

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sirius:${SIRIUS_DB_PASSWORD}@pgbouncer:6432/sirius
      DATABASE_DIRECT_URL: postgresql+asyncpg://sirius:${SIRIUS_DB_PASSWORD}@postgres:5432/sirius
      VALKEY_URL: redis://valkey:6379/0
      RUSTFS_ENDPOINT: http://rustfs:17188
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      # Module 16: real SMTP send through the mailpit service above, over
      # the internal bridge network by service name -- no external
      # provider, no API key. SMTP_FROM_ADDRESS is a plain envelope
      # From: header Mailpit accepts unauthenticated (dev-only, no real
      # delivery). FRONTEND_BASE_URL is the origin the password-reset
      # link in that email points at -- the Vite dev server's own
      # published origin (matches CORS_ORIGINS), not the api container's
      # own address, since the link is meant to be opened in a browser.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: no-reply@sirius.app
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:38210:38210"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - sirius-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:38210/healthz')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Module 12: containerized frontend running Vite's own dev server
  # directly -- no build step, no nginx/Caddy, no reverse proxy of any
  # kind. Bound to 127.0.0.1 the same loopback-only way every other
  # service already publishes (api, rustfs), not 0.0.0.0. The browser
  # (not this container) makes every API call, so it still reaches `api`
  # via the same host-published `127.0.0.1:38210` as before -- the
  # frontend's own `VITE_API_BASE_URL` default already matches; the only
  # thing that actually changes for the backend is that `CORS_ORIGINS`
  # must allow whatever origin the browser loads this container's dev
  # server from, which is unchanged (`http://127.0.0.1:5173`, the same
  # loopback port Module 06's host-run `npm run dev` already used) --
  # verified live in this module's own report, not assumed from the port
  # number matching.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # CHOKIDAR_USEPOLLING: Vite's file watcher relies on inotify events
      # that don't cross a bind-mount boundary reliably on every host
      # filesystem; polling is the standard fallback for hot-reload to
      # keep working when the source tree is bind-mounted into the
      # container (see the `volumes:` bind mount below).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Bind-mount the real source tree so `npm run dev`'s hot-reload
      # actually reflects host edits, matching the same live-editing
      # workflow Module 06-10 already had running the dev server
      # directly on the host -- an image rebuild-per-edit loop would be
      # a genuine regression for local development.
      - ../frontend:/app
      # Anonymous volume over node_modules so the host's own
      # node_modules (a different OS/architecture's native binaries in
      # some dependencies) never shadows the container's own `npm ci`
      # install.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sirius-net
