[project]
name = "sirius-api"
version = "0.1.0"
description = "Sirius - Illinois Tech Mumbai admissions and finance tracker API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "argon2-cffi>=23.1,<24.0",
  "email-validator>=2.2,<3.0",
  "redis>=5.2,<6.0",
  # Session-payload and TOTP-secret-at-rest encryption (Fernet, symmetric).
  "cryptography>=43.0,<44.0",
  # RFC 6238 TOTP generation/verification.
  "pyotp>=2.9,<3.0",
  # Module 02: .xlsx parsing for the Excel-import endpoint.
  "openpyxl>=3.1,<4.0",
  # Module 02: FastAPI's UploadFile / File() requires python-multipart at
  # runtime to parse multipart/form-data request bodies -- not imported
  # directly by application code, but FastAPI raises at request time
  # without it installed.
  "python-multipart>=0.0.12,<0.1",
  # Module 20: real signed Web Push (RFC 8291/8292) delivery -- the
  # standard library for this, wraps VAPID signing + payload encryption.
  "pywebpush>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["argon2.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
