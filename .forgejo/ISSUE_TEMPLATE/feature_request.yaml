name: Feature Request
about: Suggest an addition or change to Sirius
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward about the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api (backend)
        - frontend
        - deploy (Docker Compose / Postgres / PgBouncer)
        - docs
    validations:
      required: true
