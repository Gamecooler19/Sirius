name: Bug Report
about: Report a reproducible bug in Sirius
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. If this is a security vulnerability
        (data exposure, RBAC/RLS bypass, auth bypass), please follow
        `SECURITY.md` instead of filing a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps against a local `docker compose up` stack, if possible.
      placeholder: |
        1. docker compose up -d --build
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api (backend)
        - frontend
        - deploy (Docker Compose / Postgres / PgBouncer)
        - docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
